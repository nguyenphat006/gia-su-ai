          type: string
          format: uri
          nullable: true
          title: Ảnh đại diện
        is_active:
          type: boolean
          title: Kích hoạt
          description: Chỉ định xem người dùng này phải được coi là đang hoạt động.
            Bạn nên bỏ chọn này thay vì xóa tài khoản.
