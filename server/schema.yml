      parameters:
      - in: query
        name: base_uom
        schema:
          type: integer
      - in: query
        name: base_uom__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: category__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: material_code__icontains
        schema:
          type: string
      - in: query
        name: material_name__icontains
        schema:
          type: string
      - in: query
        name: metal_spec__profile_shape
        schema:
          type: string
          title: Hình dạng mặt cắt
          enum:
          - ANGLE_V
          - FLAT_BAR
          - OVAL_PIPE
          - RECT_TUBE
          - ROUND_PIPE
          - SHEET
          - SOLID_ROUND
          - SOLID_SQUARE
          - SPECIAL_MOLD
          - SQUARE_TUBE
        description: |-
          * `ROUND_PIPE` - Ống tròn rỗng (P)
          * `SOLID_ROUND` - Tròn đặc (D)
          * `SQUARE_TUBE` - Hộp vuông rỗng (V)
          * `SOLID_SQUARE` - Vuông đặc (V...D)
          * `RECT_TUBE` - Hộp chữ nhật rỗng (CN)
          * `OVAL_PIPE` - Oval / Elip rỗng (ELIP)
          * `FLAT_BAR` - La / Dẹt đặc (L)
          * `ANGLE_V` - Thép V / Nhôm V
          * `SHEET` - Nhôm / Sắt tấm (T)
          * `SPECIAL_MOLD` - Khuôn định hình đặc biệt (SP)
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: updated_at__date__gte
        schema:
          type: string
          format: date
      - in: query
        name: updated_at__date__lte
        schema:
          type: string
          format: date
