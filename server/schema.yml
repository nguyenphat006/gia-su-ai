      - role_name
    ValueTypeEnum:
      enum:
      - TEXT
      - PROMPT
      - NUMBER
      - BOOLEAN
      type: string
      description: |-
        * `TEXT` - Văn bản ngắn
        * `PROMPT` - Prompt (văn bản dài)
        * `NUMBER` - Số
        * `BOOLEAN` - Bật / tắt
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
