components:
  schemas:
    ActionEnum:
      enum:
      - APPROVE_ALL
      - REJECT_ALL
      type: string
      description: |-
        * `APPROVE_ALL` - APPROVE_ALL
        * `REJECT_ALL` - REJECT_ALL
    ActivityPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
      required:
      - count
      - date
    AiAnswerOutcome:
      type: object
      properties:
        question_index:
          type: integer
        result:
          $ref: '#/components/schemas/AnswerResult'
        opponent_move:
          $ref: '#/components/schemas/OpponentMove'
        done:
          type: boolean
        my_score:
          type: integer
        opponent_score:
          type: integer
      required:
      - done
      - my_score
      - opponent_move
      - opponent_score
      - question_index
      - result
    AiDraftRequestRequest:
      type: object
      properties:
        grade:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GradeEnum'
          - $ref: '#/components/schemas/NullEnum'
        topic:
          type: string
          minLength: 1
          maxLength: 255
        count:
          type: integer
          maximum: 20
          minimum: 1
          default: 5
        question_type:
          allOf:
          - $ref: '#/components/schemas/QuestionTypeEnum'
          default: MULTIPLE_CHOICE
        difficulties:
