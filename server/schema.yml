openapi: 3.0.3
info:
  title: Gia Sư AI KHTN API
  version: 1.0.0
  description: API nền tảng học Khoa học Tự nhiên THCS với gia sư AI (xây dựng trên
    template ERICSS)
paths:
  /api/v1/ai-settings/:
    get:
      operationId: ai_settings_list
      description: Cấu hình AI (prompt, model, bộ lọc...). Khóa hệ thống không xóa
        được; sửa xong có hiệu lực ngay (xóa cache).
      summary: Danh sách cấu hình AI
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: key__icontains
        schema:
          type: string
      - in: query
        name: label__icontains
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: value_type
        schema:
          type: string
          title: Kiểu giá trị
          enum:
          - BOOLEAN
          - NUMBER
          - PROMPT
          - TEXT
        description: |-
          * `TEXT` - Văn bản ngắn
          * `PROMPT` - Prompt (văn bản dài)
          * `NUMBER` - Số
          * `BOOLEAN` - Bật / tắt
      - in: query
        name: value_type__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - Cấu hình AI
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAiSettingList'
          description: ''
    post:
      operationId: ai_settings_create
      description: Cấu hình AI (prompt, model, bộ lọc...). Khóa hệ thống không xóa
        được; sửa xong có hiệu lực ngay (xóa cache).
      summary: Thêm cấu hình AI
      tags:
      - Cấu hình AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSettingCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AiSettingCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AiSettingCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingCreateUpdate'
          description: ''
  /api/v1/ai-settings/{id}/:
    get:
      operationId: ai_settings_retrieve
      description: Cấu hình AI (prompt, model, bộ lọc...). Khóa hệ thống không xóa
        được; sửa xong có hiệu lực ngay (xóa cache).
      summary: Chi tiết cấu hình AI
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cấu hình AI.
        required: true
      tags:
      - Cấu hình AI
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
