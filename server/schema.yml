        — không qua POST thường.
      summary: Danh sách tài liệu nguồn
      parameters:
      - in: query
        name: created_at__date__gte
        schema:
          type: string
          format: date
      - in: query
        name: created_at__date__lte
        schema:
          type: string
          format: date
      - in: query
        name: grade
        schema:
          type: integer
          nullable: true
          title: Khối
          enum:
          - 6
          - 7
          - 8
          - 9
        description: |-
          * `6` - Khối 6
          * `7` - Khối 7
          * `8` - Khối 8
          * `9` - Khối 9
      - in: query
        name: grade__in
        schema:
          type: array
          items:
