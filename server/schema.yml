      description: Cấu hình AI (prompt, model, bộ lọc...). Khóa hệ thống không xóa
        được; sửa xong có hiệu lực ngay (xóa cache).
      summary: Cập nhật cấu hình AI
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cấu hình AI.
        required: true
      tags:
      - Cấu hình AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSettingCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AiSettingCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AiSettingCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingCreateUpdate'
          description: ''
    patch:
      operationId: ai_settings_partial_update
      description: Cấu hình AI (prompt, model, bộ lọc...). Khóa hệ thống không xóa
        được; sửa xong có hiệu lực ngay (xóa cache).
      summary: Cập nhật một phần cấu hình AI
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cấu hình AI.
        required: true
      tags:
      - Cấu hình AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAiSettingCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAiSettingCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAiSettingCreateUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingCreateUpdate'
          description: ''
    delete:
      operationId: ai_settings_destroy
      description: Cấu hình AI (prompt, model, bộ lọc...). Khóa hệ thống không xóa
        được; sửa xong có hiệu lực ngay (xóa cache).
      summary: Xóa mềm cấu hình AI
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cấu hình AI.
        required: true
      tags:
      - Cấu hình AI
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
