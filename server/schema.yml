  /api/v1/attachments/:
    get:
      operationId: attachments_list
      description: |-
        ViewSet quản lý tệp đính kèm đa hình (Polymorphic Attachment Storage).
        Hỗ trợ upload ảnh, bản vẽ CAD, PDF, tài liệu Word/Excel cho bất kỳ thực thể nào trong hệ thống.
      summary: Lấy danh sách tệp đính kèm theo thực thể
      parameters:
      - in: query
        name: entity_id
        schema:
          type: integer
        description: ID của thực thể
      - in: query
        name: entity_type
        schema:
          type: string
        description: 'Loại thực thể: USER, PRODUCT_BASE, MATERIAL, WORK_ORDER...'
      - in: query
        name: file_category
        schema:
          type: string
        description: 'Phân loại tệp: IMAGE, CAD_DRAWING, SPEC_SHEET, CONTRACT, DOCUMENT,
          OTHER'
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Tệp Đính Kèm (Attachments)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttachmentList'
          description: ''
    post:
      operationId: attachments_create
      description: |-
        ViewSet quản lý tệp đính kèm đa hình (Polymorphic Attachment Storage).
        Hỗ trợ upload ảnh, bản vẽ CAD, PDF, tài liệu Word/Excel cho bất kỳ thực thể nào trong hệ thống.
      summary: Tải lên tệp đính kèm mới (Multipart Form-Data)
      tags:
      - Tệp Đính Kèm (Attachments)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
