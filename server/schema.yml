components:
  schemas:
    ActivityPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
      required:
      - count
      - date
    Attachment:
      type: object
      description: Serializer cho tệp đính kèm đa hình (Attachments).
      properties:
        id:
          type: integer
          readOnly: true
        entity_type:
          type: string
          title: Loại thực thể
          description: 'VD: USER, PRODUCT_BASE, PRODUCT_VARIANT, MATERIAL, WORK_ORDER...'
          maxLength: 50
        entity_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Mã Id của thực thể đính kèm
        file_name:
          type: string
          title: Tên gốc của tệp
          maxLength: 255
        file_url:
          type: string
          readOnly: true
        file_size:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          title: Dung lượng tệp (bytes)
        file_size_formatted:
          type: string
          readOnly: true
        mime_type:
          type: string
          nullable: true
          title: Định dạng MIME
          maxLength: 100
        file_category:
          allOf:
          - $ref: '#/components/schemas/FileCategoryEnum'
          title: Phân loại tệp
        description:
          type: string
          nullable: true
          title: Mô tả / Ghi chú kỹ thuật
        is_active:
          type: boolean
          title: Trạng thái hoạt động
        created_by:
          type: integer
          readOnly: true
          nullable: true
          title: Người tạo
        created_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Thời điểm cập nhật gần nhất
      required:
      - created_at
      - created_by
      - created_by_name
      - entity_id
      - entity_type
      - file_size_formatted
      - file_url
      - id
      - updated_at
    AttachmentRequest:
      type: object
      description: Serializer cho tệp đính kèm đa hình (Attachments).
      properties:
        entity_type:
          type: string
          minLength: 1
          title: Loại thực thể
          description: 'VD: USER, PRODUCT_BASE, PRODUCT_VARIANT, MATERIAL, WORK_ORDER...'
          maxLength: 50
        entity_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Mã Id của thực thể đính kèm
        file:
          type: string
          format: binary
          writeOnly: true
          title: Tệp đính kèm
        file_name:
          type: string
          minLength: 1
          title: Tên gốc của tệp
          maxLength: 255
        file_size:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          title: Dung lượng tệp (bytes)
        mime_type:
          type: string
          nullable: true
          title: Định dạng MIME
          maxLength: 100
        file_category:
          allOf:
          - $ref: '#/components/schemas/FileCategoryEnum'
          title: Phân loại tệp
        description:
          type: string
          nullable: true
          title: Mô tả / Ghi chú kỹ thuật
        is_active:
          type: boolean
          title: Trạng thái hoạt động
      required:
      - entity_id
      - entity_type
      - file
    AuditDiffItem:
      type: object
      description: Một thay đổi trường dữ liệu — chỉ dùng mô tả OpenAPI.
      properties:
        field:
          type: string
        label:
          type: string
        old_value:
          nullable: true
        new_value:
          nullable: true
        old_display:
          type: string
          nullable: true
        new_display:
          type: string
          nullable: true
      required:
      - field
      - label
      - new_display
      - new_value
      - old_display
      - old_value
    AuditLogEvent:
      type: object
      description: |-
        Serializer chuẩn hóa dữ liệu sự kiện từ pghistory.models.Events
        để hiển thị trên giao diện DataTable và Diff Drawer của Frontend.
        Toàn bộ mã hành động (action_code) và nhãn (action_label) được chuẩn hóa đồng bộ 100% với RBAC.
      properties:
        id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        model_name:
          type: string
          readOnly: true
        model_code:
          type: string
          readOnly: true
        action_label:
          type: string
          readOnly: true
        action_code:
          type: string
          readOnly: true
        object_id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/AuditUser'
          readOnly: true
        url:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
        user_agent:
          type: string
          readOnly: true
        http_method:
          type: string
          readOnly: true
        diff:
          type: array
          items:
            $ref: '#/components/schemas/AuditDiffItem'
          readOnly: true
        snapshot:
          readOnly: true
      required:
      - action_code
      - action_label
      - created_at
      - diff
      - http_method
      - id
      - ip_address
      - model_code
      - model_name
      - object_id
      - snapshot
      - url
      - user
      - user_agent
    AuditUser:
      type: object
      description: Người thực hiện thao tác (trích từ pgh_context) — chỉ dùng mô tả
        OpenAPI.
      properties:
        id:
          type: integer
          nullable: true
        username:
          type: string
        full_name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
      - email
      - full_name
      - id
      - roles
      - username
    CategoryCount:
      type: object
      properties:
        label:
          type: string
        count:
          type: integer
      required:
      - count
      - label
    ChangePasswordRequest:
      type: object
      description: Serializer xử lý đổi mật khẩu cho người dùng hiện tại.
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 6
        confirm_password:
          type: string
          writeOnly: true
          minLength: 6
      required:
      - confirm_password
      - new_password
      - old_password
    CurrentUserProfile:
      type: object
      description: |-
        Serializer hiển thị hồ sơ cá nhân và quyền hạn của chính người dùng đang đăng nhập (/auth/me/).
        Chỉ endpoint này mới cần permissions để frontend phân quyền giao diện (usePermission hook).
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Tên đăng nhập
          description: Yêu cầu. 150 ký tự hoặc ít hơn. Chỉ là chữ cái, chữ số và @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          readOnly: true
        full_name:
          type: string
          title: Họ và tên hiển thị
          maxLength: 255
        email:
          title: Địa chỉ email
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone_number:
          type: string
          nullable: true
          title: Số điện thoại liên hệ
          maxLength: 30
        avatar:
          type: string
          format: uri
          nullable: true
          title: Ảnh đại diện
        is_active:
          type: boolean
          title: Kích hoạt
          description: Chỉ định xem người dùng này phải được coi là đang hoạt động.
            Bạn nên bỏ chọn này thay vì xóa tài khoản.
        is_superuser:
          type: boolean
          title: Trạng thái superuser
          description: Định rằng người dùng này có tất cả các quyền mà không gán cho
            họ một cách cụ thể.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRoleSimple'
          readOnly: true
        role_codes:
          type: array
          items:
            type: string
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
          nullable: true
          title: Ghi chú tài khoản
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_login
      - name
      - permissions
      - role_codes
      - roles
      - updated_at
      - username
    CustomTokenObtainPairRequest:
