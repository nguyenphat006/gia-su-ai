# Production stack: nginx (cổng 80) -> web (Next.js) + api (Django ASGI/gunicorn+uvicorn) + worker (Celery) + db + redis.
#
#   cp .env.prod.example .env.prod   # điền SECRET_KEY, ADMIN_PASSWORD, POSTGRES_PASSWORD...
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Dev vẫn dùng docker-compose.yml (runserver + mount source).

name: giasu-ai-prod

x-backend-env: &backend-env
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:?Thiếu SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  DATABASE_URL: postgres://${POSTGRES_USER:-giasu}:${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-giasu}
  REDIS_CACHE_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  CHANNELS_REDIS_URL: redis://redis:6379/2
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite-preview}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Thiếu ADMIN_PASSWORD}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giasu}
      POSTGRES_USER: ${POSTGRES_USER:-giasu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giasu}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    environment: *backend-env
    volumes:
      - media:/app/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *backend-env
    volumes:
      - media:/app/media
    healthcheck:
      disable: true
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  media:
